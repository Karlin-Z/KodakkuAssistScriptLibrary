name: Build and Deploy Pages

# 访问地址：https://karlin-z.github.io/KodakkuAssistScriptLibrary/
#   - /           展示页（.github/web 里的 Vue 应用，浏览 / 搜索 / 筛选全部脚本）
#   - /index.json 合并后的索引，插件与外部订阅方读取的机器可读接口
# 另外仓库根目录会生成一份同样的 OnlineRepo.json，可用 raw 直链订阅。
#
# 触发方式有两个，缺一不可：
#   1. push 到 main：维护者直接推送时生效
#   2. workflow_dispatch：自动合并用的是 GITHUB_TOKEN，它触发的 push 不会再触发 workflow，
#      所以 pr-auto-review.yml 在合并成功后会显式 dispatch 本 workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # publish-root 需要提交根目录的 OnlineRepo.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 生成索引
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 让 merge_repos 能读到完整历史，用每个 .cs 的最后提交时间生成 UpdateTime
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      # 审核 / 生成索引 / 前端构建现在都跑在 Node 上（前两者零依赖，不需要 npm install）
      - name: 配置 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/web/package-lock.json

      # 审核/合并脚本自身的规则自测，改坏了会在这里立刻失败，避免发布错误索引
      - name: 运行内置自测
        run: node .github/scripts/tests/selftest.mjs

      - name: 安装前端依赖
        working-directory: .github/web
        run: npm ci

      # 产物直接写进 _site，与下面的 merge_repos 共用同一个站点目录
      - name: 构建展示页
        working-directory: .github/web
        run: npm run build

      # 顺序不能反：vite 会清空 _site，先跑这一步 index.json 会被删掉。
      # --no-html：index.html 已经由前端产出，这里只补机器可读的索引。
      - name: 生成合并索引
        run: node .github/scripts/merge_repos.mjs --out _site --no-html

      - name: 上传站点内容
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-root:
    name: 提交总索引到仓库根目录
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 同样需要完整历史，否则 UpdateTime 会退化成检出时间
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 生成根目录索引与 guid 映射表
        run: |
          node .github/scripts/merge_repos.mjs \
            --root-json OnlineRepo.json \
            --guid-map .github/index/guid-map.json \
            --no-site

      # 内容没变就不提交，避免每次重建都留一条空提交
      - name: 有变化才提交
        run: |
          if [ -z "$(git status --porcelain -- OnlineRepo.json .github/index/guid-map.json)" ]; then
            echo "索引没有变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OnlineRepo.json .github/index/guid-map.json
          git commit -m "chore: 自动更新 OnlineRepo.json"
          git push
